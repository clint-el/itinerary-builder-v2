version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Amplify's build image ships npm/yarn but not pnpm, so install it before use.
        - npm install -g pnpm@11.12.0
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
